<!DOCTYPE html>
<!-- Declaración de tipo de documento HTML5 -->

<html lang="es">
<!-- Idioma del documento en español -->

<head>
    <!-- Metadatos y configuración de la página -->

    <meta charset="UTF-8">
    <!-- Codificación de caracteres UTF-8 -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace la página responsive -->

    <meta name="description" content="Galería de mis adorables mascotas">
    <!-- Descripción para motores de búsqueda -->

    <title>Mis Mascotas - Portafolio Semana 2</title>
    <!-- Título en la pestaña del navegador -->

    <link rel="stylesheet" href="../css/styles-mascotas.css">
    <!-- Enlace al archivo CSS externo -->
</head>

<body>
<!-- Cuerpo del documento con todo el contenido visible -->

<!-- ============================================ -->
<!-- HEADER: Encabezado con FLEXBOX -->
<!-- ============================================ -->
<header>
    <!-- Encabezado principal de la página -->

    <h1>Galería con CSS Grid</h1>
    <!-- Título principal -->

    <nav>
        <!-- Navegación -->
        <ul>
            <li><a href="../index.html">←Volver al Portafolio</a></li>
            <!-- Enlace de regreso al portafolio principal -->
        </ul>
        <ul>
            <li><a href="mascotas.html">Galeria con Flexbox</a></li>
            <!-- Enlace de regreso al portafolio principal -->
        </ul>
    </nav>
</header>

<main>
    <!-- Contenedor principal del contenido -->

    <!-- ================================ -->
    <!-- SECCIÓN INTRODUCCIÓN -->
    <!-- ================================ -->
    <section class="intro-mascotas">
        <p>
            Estos son mis compañeros más fieles. Cada uno tiene su propia personalidad
            única y llenan mi vida de alegría todos los días.
        </p>
    </section>

    <!-- ================================================ -->
    <!-- GALERÍA DE MASCOTAS - CSS GRID (TASK 4) -->
    <!-- ================================================ -->
    <section class="galeria-mascotas-grid">
        <!-- Contenedor GRID para la galería -->
        <!-- Usa display: grid con grid-template-columns -->

        <div class="galeria-grid-container">
            <!-- Mascota 1 -->
            <figure class="mascota">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400&h=400&fit=crop"
                     alt="Luna, una golden retriever">
                <figcaption>
                    <h3>Luna</h3>
                    <p>Golden Retriever de 3 años. Le encanta nadar y jugar.</p>
                </figcaption>
            </figure>

            <!-- Mascota 2 -->
            <figure class="mascota">
                <img src="https://images.unsplash.com/photo-1574158622682-e40e69881006?w=400&h=400&fit=crop"
                     alt="Michi, un gato naranja">
                <figcaption>
                    <h3>Michi</h3>
                    <p>Gato atigrado de 5 años. Independiente pero adorable.</p>
                </figcaption>
            </figure>

            <!-- Mascota 3 -->
            <figure class="mascota">
                <img src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=400&h=400&fit=crop"
                     alt="Max, un husky siberiano">
                <figcaption>
                    <h3>Max</h3>
                    <p>Husky Siberiano de 2 años. Lleno de energía.</p>
                </figcaption>
            </figure>

            <!-- Mascota 4 -->
            <figure class="mascota">
                <img src="https://images.unsplash.com/photo-1425082661705-1834bfd09dca?w=400&h=400&fit=crop"
                     alt="Coco, un conejo blanco">
                <figcaption>
                    <h3>Coco</h3>
                    <p>Conejita Holland Lop de 1 año. Tímida pero juguetona.</p>
                </figcaption>
            </figure>

            <!-- Mascota 5 -->
            <figure class="mascota">
                <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=400&h=400&fit=crop"
                     alt="Loro, un perico verde">
                <figcaption>
                    <h3>Loro</h3>
                    <p>Periquito verde parlanchín. Le gusta cantar.</p>
                </figcaption>
            </figure>

            <!-- Mascota 6 -->
            <figure class="mascota">
                <img src="https://images.unsplash.com/photo-1535591273668-578e31182c4f?w=400&h=400&fit=crop"
                     alt="Nemo, un pez dorado">
                <figcaption>
                    <h3>Nemo</h3>
                    <p>Pez dorado tranquilo. Disfruta de su acuario.</p>
                </figcaption>
            </figure>
        </div>
    </section>
</main>
