<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galería de mis adorables mascotas">
    <title>Mis Mascotas - Portafolio</title>
    <link rel="stylesheet" href="../css/styles-mascotas.css">
</head>
<body>
<!-- Encabezado de la página de mascotas -->
<header>
    <h1>Mis Mascotas</h1>
    <nav>
        <ul>
            <li><a href="../index.html">← Volver al Portafolio</a></li>
        </ul>
    </nav>
</header>

<main>
    <!-- Introducción -->
    <section class="intro-mascotas">
        <p>
            Estos son mis compañeros más fieles. Cada uno tiene su propia personalidad
            única y llenan mi vida de alegría todos los días.
        </p>
    </section>

    <!-- Galería de mascotas -->
    <section class="galeria-mascotas">
        <!-- Mascota 1 -->
        <figure class="mascota">
            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400&h=400&fit=crop"
                 alt="Luna, una golden retriever">
            <figcaption>
                <h3>Luna</h3>
                <p>
                    Luna es una Golden Retriever de 3 años. Le encanta nadar,
                    jugar a buscar la pelota y dar largos paseos por el parque.
                    Es increíblemente cariñosa y siempre está lista para dar amor.
                </p>
            </figcaption>
        </figure>

        <!-- Mascota 2 -->
        <figure class="mascota">
            <img src="https://images.unsplash.com/photo-1574158622682-e40e69881006?w=400&h=400&fit=crop"
                 alt="Michi, un gato naranja">
            <figcaption>
                <h3>Michi</h3>
                <p>
                    Michi es un gato atigrado de 5 años con una personalidad independiente
                    pero adorable. Pasa la mayor parte del día tomando siestas en lugares
                    soleados y persiguiendo juguetes por la noche.
                </p>
            </figcaption>
        </figure>

        <!-- Mascota 3 -->
        <figure class="mascota">
            <img src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=400&h=400&fit=crop"
                 alt="Max, un husky siberiano">
            <figcaption>
                <h3>Max</h3>
                <p>
                    Max es un Husky Siberiano de 2 años lleno de energía.
                    Es muy activo, ama correr y tiene los ojos azules más hermosos.
                    Es un poco travieso pero imposible de no querer.
                </p>
            </figcaption>
        </figure>

        <!-- Mascota 4 (Bonus) -->
        <figure class="mascota">
            <img src="https://images.unsplash.com/photo-1425082661705-1834bfd09dca?w=400&h=400&fit=crop"
                 alt="Coco, un conejo blanco">
            <figcaption>
                <h3>Coco</h3>
                <p>
                    Coco es una conejita Holland Lop de 1 año. Es tímida al principio
                    pero muy juguetona cuando toma confianza. Le encantan las zanahorias
                    y saltar por toda la casa.
                </p>
            </figcaption>
        </figure>
    </section>
</main>

<!-- Pie de página -->
<footer>
    <p>&copy; 2025 Maryhug Durán. Todos los derechos reservados.</p>
</footer>
</body>
</html>
